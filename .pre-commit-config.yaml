default_language_version:
  python: python3.13

exclude: ^(build|dist|\.eggs|\.git|\.hg|\.mypy_cache|\.tox|\.venv|_build|buck-out|build|dist)$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: "ruff lint"
        args:
          - --fix
          - --exit-non-zero-on-fix
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-format
        name: "ruff format"
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: "mypy type check"
        files: ^src/
        additional_dependencies:
          - openai>=2.51.0
          - python-dotenv>=1.2.2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "hygiene trailing whitespace"
      - id: end-of-file-fixer
        name: "hygiene end of file newline"
      - id: mixed-line-ending
        name: "hygiene mixed line endings"
        args: [--fix=lf]

      - id: check-yaml
        name: "hygiene validate YAML"
      - id: check-toml
        name: "hygiene validate TOML"
      - id: check-json
        name: "hygiene validate JSON"

      - id: check-ast
        name: "hygiene validate Python AST"
      - id: debug-statements
        name: "hygiene block debug statements"
      - id: check-builtin-literals
        name: "hygiene literal builtins"

      - id: check-merge-conflict
        name: "hygiene merge conflict markers"
      - id: check-added-large-files
        name: "hygiene large file guard"
        args: [--maxkb=500]
